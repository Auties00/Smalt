# Pulls the project's hosted test data into ~/.smalt/testdata (SMALT_TESTDATA): the OCI artifacts that
# tools/testdata/artifacts.tsv pins by digest on GHCR, one per area. The tests read nothing else, so a run
# never downloads from the sources the manifests name. Each artifact is a set of tar shards, streamed into the
# data directory one at a time, so the runner's disk holds the data once. A shard that cannot be pulled
# fails the step, and a file the pull leaves out fails its test.
name: Test data
description: Pulls the pinned test-data artifacts from GHCR
inputs:
  areas:
    description: Space-separated areas of artifacts.tsv to pull, or all
    default: all
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v1

    - name: Log in to GHCR
      shell: bash
      run: echo '${{ github.token }}' | oras login ghcr.io -u '${{ github.actor }}' --password-stdin

    - name: Pull the test data
      shell: bash
      run: |
        set -euo pipefail
        root="${SMALT_TESTDATA:-$HOME/.smalt/testdata}"
        mkdir -p "$root"
        wanted='${{ inputs.areas }}'
        grep -v '^#' tools/testdata/artifacts.tsv | tr -d '\r' | while IFS=$'\t' read -r area reference; do
          if [ "$wanted" != all ] && ! grep -qw -- "$area" <<< "$wanted"; then
            continue
          fi
          repository="${reference%@*}"
          for layer in $(oras manifest fetch "$reference" | python3 -c 'import json,sys; print(" ".join(l["digest"] for l in json.load(sys.stdin)["layers"]))'); do
            oras blob fetch --output - "$repository@$layer" | tar -x -C "$root"
          done
          echo "$area: pulled"
        done
        du -sh "$root"
