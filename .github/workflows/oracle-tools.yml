# Fills the Actions caches of the oracle tools (.github/actions/oracles) on the given runners before the test jobs
# start, so that the one-time builds (ffmpeg and its libraries from source take most of an hour) never count
# against a test job's time limit, and checks that every runner has every pinned tool and every ffmpeg component
# of tools/testdata/ffmpeg-oracle/features.tsv; and writes the oracle data files that scripted black boxes produce
# (tools/testdata/raw-oracle.py, raw-lens-oracle.py and nef-oracle.py with Adobe DNG Converter, eld-sbr-oracle.py
# with libxaac and FDK AAC, mps-oracle.py with the MPEG Surround reference decoder, and svs-oracle.py with OpenSlide
# and imagecodecs, all on Windows, from the hosted test data that .github/actions/testdata pulls) into cross-OS cache
# entries keyed by their script, which .github/actions/oracle-data restores on every test runner (and, with
# data-artifact, uploads them for the jobs of the run that find an entry evicted from the 10 GB cache); and writes
# the goldens of the Opus tests with the libopus harnesses of tools/testdata/opus-oracle (the opus-goldens
# artifact). ci.yml, nightly.yml, package.yml and warm-caches.yml call it; it can also be run by hand to warm the
# caches of a branch (the pkg/* branches only restore them, see .github/scripts/cache-policy.sh).
name: Oracle tools

on:
  workflow_call:
    inputs:
      os:
        description: JSON list of runners
        type: string
        default: '["ubuntu-24.04","ubuntu-24.04-arm","windows-latest","macos-latest"]'
      tools:
        description: Install the oracle tools on the runners; false leaves them to the caller's jobs (package.yml's test jobs install their own)
        type: boolean
        default: true
      data:
        description: Also write the oracle data files that are not cached yet
        type: boolean
        default: true
      data-artifact:
        description: Also upload the oracle data files as oracle-data-* artifacts, for the jobs of the run whose cache entries were evicted
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runners
        default: '["ubuntu-24.04","ubuntu-24.04-arm","windows-latest","macos-latest"]'

permissions:
  contents: read
  # the cache listing of .github/scripts/cache-policy.sh
  actions: read
  # the hosted test data on GHCR (.github/actions/testdata), which the oracle data scripts read
  packages: read

jobs:
  install:
    name: oracle tools (${{ matrix.os }})
    if: inputs.tools != false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - name: Upload the oracle versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-versions-${{ matrix.os }}
          path: oracle-versions.tsv
          retention-days: 14

  # Adobe DNG Converter is a Windows program: its uncompressed DNG files are the oracle of the raw module's sensor
  # values. The cache paths are relative to the workspace, so that every operating system restores them alike.
  data-windows:
    name: oracle data (Adobe DNG Converter, libxaac, FDK AAC, MPEG Surround)
    if: inputs.data != false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # 3.14: the AAC-ELD script reads the zstd-compressed MSYS2 package of FDK AAC with tarfile.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Look up the raw oracle files
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/raw-oracle
          key: oracle-data-raw-${{ hashFiles('tools/testdata/raw-oracle.py') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      # The samples of the raw scripts come from the hosted test data, pulled once, by the first script that runs.
      - name: Pull the raw samples
        if: steps.raw.outputs.cache-hit != 'true'
        uses: ./.github/actions/testdata
        with:
          areas: raw

      - name: Convert the raw samples
        if: steps.raw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -I tools/testdata/raw-oracle.py
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/raw-oracle .oracle-data/raw-oracle

      - name: Save the raw oracle files
        if: steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/raw-oracle
          key: oracle-data-raw-${{ hashFiles('tools/testdata/raw-oracle.py') }}
          enableCrossOsArchive: true

      - name: Look up the NEF oracle files
        id: nef
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/nef-oracle
          key: oracle-data-nef-${{ hashFiles('tools/testdata/nef-oracle.py') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      - name: Pull the raw samples for the NEF script
        if: steps.nef.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit == 'true'
        uses: ./.github/actions/testdata
        with:
          areas: raw

      - name: Convert the NEF samples
        if: steps.nef.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -I tools/testdata/nef-oracle.py
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/nef-oracle .oracle-data/nef-oracle

      - name: Save the NEF oracle files
        if: steps.nef.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/nef-oracle
          key: oracle-data-nef-${{ hashFiles('tools/testdata/nef-oracle.py') }}
          enableCrossOsArchive: true

      - name: Look up the raw lens and pixel-shift oracle files
        id: lens
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/raw-lens-oracle
          key: oracle-data-raw-lens-${{ hashFiles('tools/testdata/raw-lens-oracle.py') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      - name: Pull the raw samples for the lens script
        if: >-
          steps.lens.outputs.cache-hit != 'true' && steps.raw.outputs.cache-hit == 'true'
          && steps.nef.outputs.cache-hit == 'true'
        uses: ./.github/actions/testdata
        with:
          areas: raw

      - name: Convert the lens correction and pixel-shift samples
        if: steps.lens.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -I tools/testdata/raw-lens-oracle.py
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/raw-lens-oracle .oracle-data/raw-lens-oracle

      - name: Save the raw lens and pixel-shift oracle files
        if: steps.lens.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/raw-lens-oracle
          key: oracle-data-raw-lens-${{ hashFiles('tools/testdata/raw-lens-oracle.py') }}
          enableCrossOsArchive: true

      # libxaac, built from its pinned commit with MSYS2's gcc (the toolchain that pinned the encoded streams), and
      # the pinned FDK AAC DLL decode the AAC-ELD low delay SBR streams.
      - name: Look up the AAC-ELD oracle files
        id: eld
        uses: actions/cache/restore@v4
        with:
          path: |
            .oracle-data/eld-sbr-oracle
            .oracle-data/eld-sbr-fdk
          key: oracle-data-eld-sbr-${{ hashFiles('tools/testdata/eld-sbr-oracle.py', 'mpeg/src/test/resources/com/github/auties00/smalt/audio/aac/eld-sbr/**') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      - name: Pull the AAC-ELD conformance streams
        if: steps.eld.outputs.cache-hit != 'true'
        uses: ./.github/actions/testdata
        with:
          areas: mpeg-audio

      - name: Decode the AAC-ELD streams with libxaac and FDK AAC
        if: steps.eld.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          python -I tools/testdata/eld-sbr-oracle.py "$RUNNER_TEMP/eld" --fdk
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/eld-sbr-oracle .oracle-data/eld-sbr-oracle
          cp -r ~/.smalt/cache/eld-sbr-fdk .oracle-data/eld-sbr-fdk

      - name: Save the AAC-ELD oracle files
        if: steps.eld.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .oracle-data/eld-sbr-oracle
            .oracle-data/eld-sbr-fdk
          key: oracle-data-eld-sbr-${{ hashFiles('tools/testdata/eld-sbr-oracle.py', 'mpeg/src/test/resources/com/github/auties00/smalt/audio/aac/eld-sbr/**') }}
          enableCrossOsArchive: true

      # The MPEG Surround decoder of the ISO/IEC 23003-3 reference software, patched to the full 23003-1 syntax and
      # built with MSYS2's gcc, decodes synthetic and reference-encoded MPEG Surround streams.
      - name: Look up the MPEG Surround oracle files
        id: mps
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/mps-oracle
          key: oracle-data-mps-${{ hashFiles('tools/testdata/mps-oracle.py', 'tools/testdata/mps-oracle/**') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      - name: Decode the MPEG Surround streams with the reference software
        if: steps.mps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          python -I tools/testdata/mps-oracle.py "$RUNNER_TEMP/mps"
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/mps-oracle .oracle-data/mps-oracle

      - name: Save the MPEG Surround oracle files
        if: steps.mps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/mps-oracle
          key: oracle-data-mps-${{ hashFiles('tools/testdata/mps-oracle.py', 'tools/testdata/mps-oracle/**') }}
          enableCrossOsArchive: true

      - name: Upload the oracle data files
        if: inputs.data-artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-data-windows
          path: .oracle-data/
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # OpenSlide and imagecodecs render the Aperio slides, on Windows: the OpenJPEG that imagecodecs' Linux wheel
  # bundles rounds the irreversible component transform of one sample of the 33005 slide otherwise.
  data-openslide:
    name: oracle data (OpenSlide)
    if: inputs.data != false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Look up the Aperio slide oracle files
        id: svs
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/svs-oracle
          key: oracle-data-svs-${{ hashFiles('tools/testdata/svs-oracle.py') }}
          enableCrossOsArchive: true
          lookup-only: ${{ !inputs.data-artifact }}

      - name: Pull the Aperio slides
        if: steps.svs.outputs.cache-hit != 'true'
        uses: ./.github/actions/testdata
        with:
          areas: images

      - name: Render the Aperio slides with OpenSlide
        if: steps.svs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --quiet openslide-python==1.4.6 openslide-bin==4.0.1.2 tifffile==2026.10.15 \
            imagecodecs==2026.10.10 numpy
          python -I tools/testdata/svs-oracle.py
          mkdir -p .oracle-data
          cp -r ~/.smalt/cache/svs-oracle .oracle-data/svs-oracle

      - name: Save the Aperio slide oracle files
        if: steps.svs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/svs-oracle
          key: oracle-data-svs-${{ hashFiles('tools/testdata/svs-oracle.py') }}
          enableCrossOsArchive: true

      - name: Upload the oracle data files
        if: inputs.data-artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-data-openslide
          path: .oracle-data/
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  # The libopus reference harnesses of tools/testdata/opus-oracle (build.py, with MSYS2's gcc, the toolchain of the
  # committed goldens) print the goldens of the Opus tests, which are committed in audio/src/test, so no test job
  # restores them: the opus-goldens artifact carries them for a change of the oracle (a libopus version move) to copy
  # into the tests. goldens.txt holds the lines of OpusEncoderGoldenTest (check_), OpusMultistreamGoldenTest and
  # OpusProjectionGoldenTest (p), traces.txt those of OpusPacketLossGoldenTest, downmix.txt those of
  # OpusDownmixTest, dnn-goldens.txt those of OpusDnnGoldenTest, and dnn-units.bin is OpusDnnUnitTest's reference.
  data-opus:
    name: oracle data (libopus goldens)
    if: inputs.data != false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Look up the Opus goldens
        id: opus
        uses: actions/cache/restore@v4
        with:
          path: .oracle-data/opus-goldens
          key: oracle-data-opus-${{ hashFiles('tools/testdata/opus-oracle/**') }}
          enableCrossOsArchive: true

      # The goldens' inputs are built from the RFC 8251 test vectors of the hosted test data.
      - name: Pull the Opus test vectors
        if: steps.opus.outputs.cache-hit != 'true'
        uses: ./.github/actions/testdata
        with:
          areas: open-audio

      # Relative paths: the Git Bash tar reads a drive letter's colon as a remote host.
      - name: Run the libopus reference harnesses
        if: steps.opus.outputs.cache-hit != 'true'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          gcc --version
          mkdir -p opus-oracle/vectors .oracle-data/opus-goldens
          tar -xzf ~/.smalt/testdata/vectors/opus_testvectors-rfc8251.tar.gz --strip-components=1 -C opus-oracle/vectors
          out=.oracle-data/opus-goldens
          tools=tools/testdata/opus-oracle
          python -I $tools/build.py opus-oracle
          python -I $tools/goldens.py opus-oracle/vectors 'opus-oracle\msenc.exe' opus-oracle/io > "$out/goldens.txt"
          python -I $tools/traces.py opus-oracle/vectors opus-oracle opus-oracle/io > "$out/traces.txt"
          python -I $tools/downmix.py opus-oracle/vectors opus-oracle opus-oracle/io > "$out/downmix.txt"
          python -I $tools/dnn_goldens.py opus-oracle/vectors opus-oracle opus-oracle/dnn > "$out/dnn-goldens.txt"
          ./opus-oracle/dnnunit.exe "$out/dnn-units.bin"
          wc -l "$out"/*.txt

      - name: Save the Opus goldens
        if: steps.opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oracle-data/opus-goldens
          key: oracle-data-opus-${{ hashFiles('tools/testdata/opus-oracle/**') }}
          enableCrossOsArchive: true

      - name: Upload the Opus goldens
        uses: actions/upload-artifact@v4
        with:
          name: opus-goldens
          path: .oracle-data/opus-goldens/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
