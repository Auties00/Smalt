# Pull requests and pushes: build and unit tests on the smoke data tier and the clips, with the oracle tools of
# tools/testdata/oracles.tsv on every runner (a missing oracle fails), on Linux x64, Windows and macOS with the
# Vector API, on Linux with the scalar twins, and the kernel suites on Linux arm64 (NEON); the skip baseline; the javadoc lints, the comment
# lint, the generated-code check and the third-party notices check. The full conformance tier and the capture
# devices run nightly (nightly.yml).
name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'LICENSE', 'tools/docs/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # the cache listing of .github/scripts/cache-policy.sh
  actions: read

env:
  JAVA_VERSION: '26'
  # Tests read only what the smoke tier cached; a vector outside it skips its test instead of downloading.
  SMALT_CONFORMANCE_DOWNLOAD: 'false'

jobs:
  # The oracle tools of every test runner, cached before the tests start (the first build of a branch takes most of
  # an hour); a runner whose tools fail still runs its tests, which then fail on the missing oracle.
  oracles:
    uses: ./.github/workflows/oracle-tools.yml
    with:
      os: '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]'

  test:
    name: test (${{ matrix.os }}, ${{ matrix.simd }})
    needs: oracles
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # The macOS runners have three cores: the suite takes them about three hours.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 330 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vector API kernels on x86 (AVX2/AVX-512) and on arm64 (NEON, macOS); the JIT guard runs in it.
          - { os: ubuntu-latest, simd: vector, modules: '', tests: '', set: smoke }
          - { os: windows-latest, simd: vector, modules: '', tests: '', set: smoke }
          - { os: macos-latest, simd: vector, modules: '', tests: '', set: smoke }
          # Scalar twins only. The it module is left out: its JIT guard forces the Vector API anyway.
          - { os: ubuntu-latest, simd: scalar, modules: '-pl !it', tests: '', set: smoke }
          # NEON on Linux, cheaply: the kernel suites that compare every Vector API kernel with its scalar twin
          # (the whole suite runs on Linux arm64 nightly).
          - { os: ubuntu-24.04-arm, simd: vector, modules: '-pl !it', set: kernels,
              tests: '**/*Kernel*Test,**/*Equivalence*Test,**/*Dsp*Test,**/*Simd*Test,**/Vector*Test' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Name the job in the skip baseline
        shell: bash
        run: echo "SMALT_SKIP_JOB=$(echo '${{ runner.os }}-${{ runner.arch }}-${{ matrix.simd }}-${{ matrix.set }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Each module's suite in several test JVMs (two on the hosted runners); the JIT guard (it) runs alone in
      # one, after the others.
      - uses: ./.github/actions/test-jvms

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Build and test
        id: test
        shell: bash
        run: >
          mvn -B -ntp -fae ${{ matrix.modules }} verify $SMALT_TEST_FORKS -Dsmalt.test.simd=${{ matrix.simd == 'vector' }}
          ${{ matrix.tests != '' && format('-Dtest={0} -Dsurefire.failIfNoSpecifiedTests=false', matrix.tests) || '' }}

      # Every skip carries a reason id, and no count may grow over tools/testdata/skip-baseline.tsv.
      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the skip report
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: skips-${{ env.SMALT_SKIP_JOB }}
          path: |
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 14

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.simd }}
          path: |
            **/target/surefire-reports/
            it/target/jit-guard/
            ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  # Hostile inputs within the means of a small deployment: every fuzz seed and saved finding, and the
  # decompression-bomb, cyclic-offset and deep-nesting tests of it, in a 256 MiB heap (at the JVM's default
  # thread stack, as every test runs), so that an allocation the limits do not bound fails as an
  # OutOfMemoryError instead of passing on a large runner.
  hostile:
    name: hostile inputs (256 MiB heap)
    needs: oracles
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - name: Replay the fuzz inputs and run the hostile-input tests
        shell: bash
        run: >
          mvn -B -ntp -fae -pl core,image,audio,video,mpeg,raw,it -am verify
          -Dtest='**/fuzz/FuzzRegressionTest,**/hostile/**' -Dsurefire.failIfNoSpecifiedTests=false
          -Dsmalt.test.jvmArgs=-Xmx256m

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-hostile
          path: '**/target/surefire-reports/'
          retention-days: 7

  javadoc:
    name: javadoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Every {@link}, @see, @param and @throws must resolve, private members included.
      - name: Javadoc reference lint
        run: mvn -B -ntp -fae -Pjavadoc-check compile javadoc:javadoc-no-fork -DskipTests

      # doclint "all" on the exported API: its warnings may not exceed tools/lint/baseline.tsv.
      - name: Javadoc doclint on the exported API
        shell: bash
        run: |
          mvn -B -ntp -fae -Pjavadoc-check compile javadoc:javadoc-no-fork@doclint-all -DskipTests | tee doclint-all.log
          python tools/lint/doclint.py --javadoc-log doclint-all.log

      # The jars Central receives: sources, and javadoc built with doclint on (all groups but missing).
      - name: Sources and javadoc jars
        run: mvn -B -ntp -fae -Prelease -pl '!it' package -DskipTests

  lint:
    name: comment lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The comment rules of CLAUDE.md (Documentation, section 11) against the shrink-only baseline.
      - name: Comment lint
        run: python tools/lint/doclint.py

      # A pull request may shrink the baselines but never grow the comment findings or the environment skips.
      - name: Baselines only shrink
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show "origin/${{ github.base_ref }}:tools/lint/baseline.tsv" > base-baseline.tsv 2>/dev/null || : > base-baseline.tsv
          if [ -s base-baseline.tsv ]; then python tools/lint/doclint.py --shrink-only base-baseline.tsv; fi
          git show "origin/${{ github.base_ref }}:tools/testdata/skip-baseline.tsv" > base-skips.tsv 2>/dev/null || : > base-skips.tsv
          if [ -s base-skips.tsv ]; then python tools/testdata/skips.py shrink-only base-skips.tsv; fi

  codegen:
    name: generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Every generated kernel must be exactly what its generator and template produce.
      - name: Regenerate into a temporary copy and compare
        run: python tools/codegen/check.py

  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The committed notices must be exactly what the scripts produce from tools/notices.
      - name: Regenerate the notices
        run: bash tools/notices/build-notices.sh && python tools/notices/split-notices.py

      - name: Check they match the committed files
        run: |
          git status --porcelain -- tools/notices '*/src/main/resources/META-INF/THIRD-PARTY-NOTICES'
          git diff --exit-code -- tools/notices '*/src/main/resources/META-INF/THIRD-PARTY-NOTICES'
          test -z "$(git status --porcelain --untracked-files=all -- '*/src/main/resources/META-INF/')"

  # Inactive until the repository variable SMALT_API_BASELINE names a released version (from 1.0 on).
  api-compat:
    name: API compatibility
    if: vars.SMALT_API_BASELINE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: japicmp against ${{ vars.SMALT_API_BASELINE }}
        run: mvn -B -ntp -fae -pl '!it' verify -DskipTests -Dsmalt.api.baseline=${{ vars.SMALT_API_BASELINE }}
