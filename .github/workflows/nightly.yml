# Nightly: the full conformance tier (every vector and clip in tools/testdata) with the oracle tools, the JIT
# guard, the whole suite on Linux arm64, the next JDK's early-access build, and the capture devices on each OS
# (capture.yml).
name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: Which jobs run (all, conformance, arm64, early-access or capture)
        default: all

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '26'

jobs:
  # The oracle tools of the Linux runners, cached before the long jobs start.
  oracles:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs != 'capture'
    uses: ./.github/workflows/oracle-tools.yml
    with:
      os: '["ubuntu-latest","ubuntu-24.04-arm"]'

  # The full tier is about 14 GB of vectors plus 1.3 GB of clips, more than the hosted runners' 10 GB repository
  # cache holds next to everything else. The nightly caches the vectors of every host but the two largest
  # (raw.pixls.us camera samples and media.xiph.org sequences, about 6.8 GB, fast to download) in one entry and
  # downloads those two every night; the clips come from the CI's cache entry. When the repository variable
  # SMALT_NIGHTLY_RUNNER names a self-hosted runner, its home keeps everything and the cache steps are skipped.
  full-conformance:
    name: full conformance tier
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'conformance') }}
    runs-on: ${{ vars.SMALT_NIGHTLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
      SMALT_SKIP_JOB: linux-x64-vector-full
      UNCACHED_HOSTS: --exclude-host raw.pixls.us --exclude-host media.xiph.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/oracles

      - name: Restore the cached part of the full tier
        id: full
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.smalt/cache/conformance
          key: testdata-full-cached-${{ hashFiles('tools/testdata/vectors.tsv') }}

      # Saved before the uncached hosts are downloaded, so that the entry holds only the cached part.
      - name: Fetch and cache that part
        if: runner.environment == 'github-hosted' && steps.full.outputs.cache-hit != 'true'
        run: python tools/testdata/testdata.py fetch --tier full --no-clips $UNCACHED_HOSTS

      - name: Save the cached part of the full tier
        if: runner.environment == 'github-hosted' && steps.full.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.smalt/cache/conformance
          key: testdata-full-cached-${{ hashFiles('tools/testdata/vectors.tsv') }}

      - uses: ./.github/actions/testdata
        with:
          vectors: 'false'

      - name: Fetch the rest of the full tier
        run: python tools/testdata/testdata.py fetch --tier full

      # Every vector a test asks for is recorded, so a vector added to a test without a manifest
      # entry fails the run below instead of silently skipping forever.
      - name: Build and test (Vector API), including the JIT guard
        id: test
        run: mvn -B -ntp -fae verify -Dsmalt.conformance.record=${{ runner.temp }}/requested.tsv

      - name: Check the manifest covers every requested vector
        if: always()
        run: python tools/testdata/testdata.py record --check ${{ runner.temp }}/requested.tsv

      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            **/target/surefire-reports/
            it/target/jit-guard/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 14

  # The whole suite on Linux arm64 (NEON), whose kernels alone run on every push (ci.yml).
  arm64:
    name: full suite on Linux arm64
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
      SMALT_SKIP_JOB: linux-arm64-vector-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Build and test (Vector API), including the JIT guard
        id: test
        run: mvn -B -ntp -fae verify

      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-reports
          path: |
            **/target/surefire-reports/
            it/target/jit-guard/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 14

  # The next feature release's early-access build: the incubating Vector API changes between
  # releases, so this is the early warning. Informational: it does not fail the workflow.
  jdk-early-access:
    name: JDK early access
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'early-access') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: EA

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      # javac --release N cannot see the incubator modules of another release, so the EA build
      # compiles for its own feature version.
      - name: Build and test, including the JIT guard
        run: |
          java -version
          release=$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ {print $3}')
          mvn -B -ntp -fae verify -Dsmalt.java.release="$release"

  capture:
    name: capture devices
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'capture'
    uses: ./.github/workflows/capture.yml
