# Nightly: the full conformance tier (every vector and clip in tools/testdata), the JIT guard, the
# next JDK's early-access build, and capture device enumeration on each OS.
name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '26'

jobs:
  # The full tier is about 6 GB of vectors plus 1.3 GB of clips, too much for the hosted runners'
  # 10 GB repository cache to keep next to everything else, so it is downloaded on every run unless
  # the repository variable SMALT_NIGHTLY_RUNNER names a self-hosted runner whose home keeps it.
  full-conformance:
    name: full conformance tier
    runs-on: ${{ vars.SMALT_NIGHTLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the oracle tools
        if: runner.os == 'Linux'
        run: |
          if command -v apt-get > /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg webp
          fi

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Fetch the full test data
        run: python tools/testdata/testdata.py fetch --tier full

      # Every vector a test asks for is recorded, so a vector added to a test without a manifest
      # entry fails the run below instead of silently skipping forever.
      - name: Build and test (Vector API), including the JIT guard
        run: mvn -B -ntp -fae verify -Dsmalt.conformance.record=${{ runner.temp }}/requested.tsv

      - name: Check the manifest covers every requested vector
        if: always()
        run: python tools/testdata/testdata.py record --check ${{ runner.temp }}/requested.tsv

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            **/target/surefire-reports/
            it/target/jit-guard/
          retention-days: 14

  # The next feature release's early-access build: the incubating Vector API changes between
  # releases, so this is the early warning. Informational: it does not fail the workflow.
  jdk-early-access:
    name: JDK early access
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: EA

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore the smoke test data
        id: smoke-cache
        uses: actions/cache@v4
        with:
          path: ~/.smalt/cache/conformance
          key: testdata-smoke-${{ hashFiles('tools/testdata/vectors.tsv') }}
          enableCrossOsArchive: true

      - name: Fetch the smoke test data
        if: steps.smoke-cache.outputs.cache-hit != 'true'
        run: python tools/testdata/testdata.py fetch --tier smoke --no-clips

      # javac --release N cannot see the incubator modules of another release, so the EA build
      # compiles for its own feature version.
      - name: Build and test, including the JIT guard
        run: |
          java -version
          release=$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ {print $3}')
          mvn -B -ntp -fae verify -Dsmalt.java.release="$release"

  # No runner has a camera or a display server, so this mostly compiles each OS backend's bindings
  # and enumerates no devices; the device tests skip.
  capture:
    name: capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Capture tests
        shell: bash
        run: >
          mvn -B -ntp -fae -pl capture -am verify
          -Dtest='com/github/auties00/smalt/capture/**/*'
          -Dsurefire.failIfNoSpecifiedTests=false
