# Nightly: the full conformance tier (every vector and clip in tools/testdata) with the oracle tools, the whole suite
# on Linux arm64, the kernel JIT guard's nightly scenario matrix and the JIT stress test on every OS, the bit-exact
# suites under C1 only and under C2 only, the next JDK's early-access build, and the capture devices on each OS
# (capture.yml).
name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: Which jobs run (all, conformance, arm64, kernel-jit, jit-tiers, early-access or capture)
        default: all

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # the cache listing of .github/scripts/cache-policy.sh
  actions: read

env:
  JAVA_VERSION: '26'

jobs:
  # The oracle tools of the Linux runners, cached before the long jobs start.
  oracles:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs != 'capture'
    uses: ./.github/workflows/oracle-tools.yml
    with:
      os: '["ubuntu-latest","ubuntu-24.04-arm"]'

  # The full tier is about 14 GB of vectors plus 1.3 GB of clips, more than the hosted runners' 10 GB repository
  # cache holds next to the oracle tools and the smoke tier every branch restores, so the nightly downloads the
  # vectors outside the smoke tier every night instead of caching them; the smoke vectors and the clips come from
  # the cache entries of the default branch. When the repository variable SMALT_NIGHTLY_RUNNER names a self-hosted
  # runner, its home keeps everything.
  full-conformance:
    name: full conformance tier
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'conformance') }}
    runs-on: ${{ vars.SMALT_NIGHTLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
      SMALT_SKIP_JOB: linux-x64-vector-full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Fetch the rest of the full tier
        run: python tools/testdata/testdata.py fetch --tier full

      # Every vector a test asks for is recorded, so a vector added to a test without a manifest
      # entry fails the run below instead of silently skipping forever.
      - name: Build and test (Vector API), including the JIT guard
        id: test
        run: mvn -B -ntp -fae verify -Dsmalt.conformance.record=${{ runner.temp }}/requested.tsv

      - name: Check the manifest covers every requested vector
        if: always()
        run: python tools/testdata/testdata.py record --check ${{ runner.temp }}/requested.tsv

      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            **/target/surefire-reports/
            */target/kernel-guard/*/*/result.tsv
            it/target/kernel-guard-self/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 14

  # The whole suite on Linux arm64 (NEON), whose kernels alone run on every push (ci.yml).
  arm64:
    name: full suite on Linux arm64
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
      SMALT_SKIP_JOB: linux-arm64-vector-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Build and test (Vector API), including the JIT guard
        id: test
        run: mvn -B -ntp -fae verify

      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-reports
          path: |
            **/target/surefire-reports/
            */target/kernel-guard/*/*/result.tsv
            it/target/kernel-guard-self/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 14

  # The kernel JIT guard under its nightly scenarios (the pull-request ones, a polluted profile under C2 only and five
  # more stress seeds) on every OS, its self-test, and the JIT stress test: mixed codec workloads in fresh JVMs that
  # may allocate nothing from the Vector API fallback after warm-up (JitStressTest; ffmpeg-made streams on Linux).
  kernel-jit:
    name: kernel JIT guard and stress (${{ matrix.os }})
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'kernel-jit') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles
        if: runner.os == 'Linux'

      - name: Guard, self-test and stress test
        shell: bash
        run: >
          mvn -B -ntp -fae -pl kernel-lint,core,image,audio,video,mpeg,capture,raw,it verify
          -Dtest='**/*KernelGuardTest,**/KernelGuardSelfTest,**/JitStressTest' -Dsurefire.failIfNoSpecifiedTests=false
          -Dsmalt.jit.scenarios=nightly -Dsmalt.jit.stress=true

      - name: Upload the guard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-jit-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            */target/kernel-guard/*/*/result.tsv
            */target/kernel-guard/*/*/vm.log
            it/target/kernel-guard-self/
            it/target/jit-stress/*/stdout.log
          retention-days: 14

  # The suites whose output is pinned bit for bit (conformance vectors, golden dumps, oracle differentials), once with
  # C1 alone and once with C2 alone, compiling early: a codec whose output depends on the compiler tier fails one of
  # them against the same expected output. C1 does not intrinsify the Vector API, so under C1 every kernel would run
  # the API's allocating Java fallback, a hundred times slower (the AV1 encoder goldens alone outlast the job); the C1
  # leg runs the scalar twins instead, and the C2 leg the Vector API kernels, whose equality with their scalar twins
  # the kernel JIT guard checks on C2 code at every vector width.
  jit-tiers:
    name: bit-exact suites (${{ matrix.tier }})
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'jit-tiers') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: c1-only, flags: '-XX:TieredStopAtLevel=1', simd: false, skips: linux-x64-scalar-smoke }
          - { tier: c2-only, flags: '-XX:-TieredCompilation -XX:CompileThresholdScaling=0.05', simd: true,
              skips: linux-x64-vector-smoke }
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
      SMALT_SKIP_JOB: ${{ matrix.skips }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Bit-exact suites under ${{ matrix.tier }}
        id: test
        shell: bash
        run: >
          mvn -B -ntp -fae -pl core,image,audio,video,mpeg,raw verify
          -Dtest='**/*Conformance*Test,**/*Golden*Test,**/*Behavior*Test,**/*Suite*Test,**/*Differential*Test,**/*Vectors*Test'
          -Dsurefire.failIfNoSpecifiedTests=false -Dsmalt.test.simd=${{ matrix.simd }} "-Dsmalt.test.jvmArgs=${{ matrix.flags }}"

      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jit-tiers-${{ matrix.tier }}
          path: '**/target/surefire-reports/'
          retention-days: 14

  # Line and branch coverage of every module's tests on the smoke tier, as a map of the spec features no
  # test exercises (tools/coverage/README.md). The agent changes how the JIT compiles, so this runs apart
  # from the conformance job; it fails when an area falls below tools/coverage/baseline.tsv.
  coverage:
    name: coverage map
    needs: oracles
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata
        with:
          clips: 'false'

      - name: Test with the coverage agent
        run: mvn -B -ntp -fae -Pcoverage verify -Dmaven.test.failure.ignore=true

      - name: Summarize and check the coverage
        shell: bash
        run: |
          status=0
          python tools/coverage/coverage.py it/target/site/jacoco-aggregate/jacoco.xml --markdown coverage.md \
            --tsv coverage.tsv --check tools/coverage/baseline.tsv || status=$?
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            it/target/site/jacoco-aggregate/
            coverage.md
            coverage.tsv
          retention-days: 30

  # A quarter of the fuzz targets each night, in turn, fuzzed in a 256 MiB heap at the default thread
  # stack: an allocation the limits do not bound becomes an oom- finding and unbounded recursion a crash.
  # The findings are uploaded; tools/fuzz/README.md describes how to reproduce and save one.
  fuzz-small-heap:
    name: fuzz shard (256 MiB heap)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fuzz the shard of the day
        shell: bash
        run: |
          shard=$(( 10#$(date -u +%j) % 4 ))
          python tools/fuzz/fuzz.py budget --online --no-seeds --time 45 --memory 256 --select "shard=$shard/4"

      - name: Upload the findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-small-heap-findings
          path: |
            target/fuzz/*/findings/
            target/fuzz/*/fuzz.log
          retention-days: 14

  # The next feature release's early-access build: the incubating Vector API changes between
  # releases, so this is the early warning. Informational: it does not fail the workflow.
  jdk-early-access:
    name: JDK early access
    needs: oracles
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'early-access') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    env:
      SMALT_CONFORMANCE_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: EA

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      # javac --release N cannot see the incubator modules of another release, so the EA build
      # compiles for its own feature version.
      - name: Build and test, including the JIT guard
        run: |
          java -version
          release=$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ {print $3}')
          mvn -B -ntp -fae verify -Dsmalt.java.release="$release"

  capture:
    name: capture devices
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'capture'
    uses: ./.github/workflows/capture.yml
