# Manual: builds the given modules with what they depend on, then runs only their own test suites on the chosen
# runners with the oracle tools, the smoke data tier and the clips, and checks their skips against the CI jobs' rows
# of the skip baseline. Development tooling dispatches it on snapshot branches to test one change without the
# whole matrix: one job per runner, which installs its oracle tools itself from the default branch's caches (the
# pkg/* branches only restore them, see .github/scripts/cache-policy.sh), plus, when a runner other than Linux x64
# takes part, a short job that makes sure that the cache holds the clips those runners cannot derive themselves,
# and the oracle data jobs of oracle-tools.yml, which write the oracle data files the cache lacks.
name: Package tests

on:
  workflow_dispatch:
    inputs:
      modules:
        description: Comma-separated modules whose suites run (for example core,image)
        required: true
      os:
        description: JSON list of runners
        default: '["ubuntu-latest"]'
      tests:
        description: Optional surefire -Dtest filter
        default: ''
      simd:
        description: vector or scalar
        default: vector
      coverage:
        description: true to run with the JaCoCo coverage profile (in one test JVM per module) and upload the reports
        default: 'false'
      maven_args:
        description: Extra Maven arguments for the test run, for example -Dsmalt.soak.minutes=5
        default: ''
      properties:
        description: Optional extra system properties for the test JVMs, for example -Dsmalt.threads=1
        default: ''
      forks:
        description: Test JVMs per module (smalt.test.forks), a number or a multiple of the runner's vCPUs (rounded up) such as 0.5C; 1 runs the suite in one JVM (it and capture always use one)
        default: 0.5C
      cache_save:
        description: "Save the oracle and test data entries this run misses: auto (the default branch owns them), or true to keep this branch's own copy"
        default: auto

# A new dispatch of the same check on the same branch supersedes the run in progress; other checks of the branch
# keep running.
concurrency:
  group: package-${{ github.ref }}-${{ inputs.modules }}-${{ inputs.os }}-${{ inputs.tests }}-${{ inputs.simd }}-${{ inputs.coverage }}-${{ inputs.forks }}-${{ inputs.maven_args }}-${{ inputs.properties }}
  cancel-in-progress: true

permissions:
  contents: read
  # the cache listing of .github/scripts/cache-policy.sh
  actions: read

env:
  JAVA_VERSION: '26'
  SMALT_CONFORMANCE_DOWNLOAD: 'false'

jobs:
  # The clips are derived on Linux x64 only (swscale's arm64 kernels scale differently and the encoder golden tests
  # pin the x86-64 clips); the other runners restore them. When the cache already holds them, as it does once the
  # default branch has run warm-caches.yml, this job only looks the entry up.
  clips:
    name: clips (ubuntu-latest)
    if: contains(inputs.os, 'windows') || contains(inputs.os, 'macos') || contains(inputs.os, 'arm')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: ./.github/actions/testdata
        with:
          vectors: 'false'
          clips: fill
          save: ${{ inputs.cache_save }}

  # The oracle data files of the scripted black boxes (Adobe DNG Converter, libxaac, FDK AAC, OpenSlide), written
  # when the cache lacks them. The full tier the nightly caches fills most of the 10 GB Actions cache, so these
  # entries may be evicted between this job and the tests; the artifacts of this run stand in for them.
  data:
    uses: ./.github/workflows/oracle-tools.yml
    with:
      os: ${{ inputs.os }}
      tools: false
      data-artifact: true

  test:
    name: test (${{ matrix.os }})
    needs: [clips, data]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Name the job in the skip baseline
        shell: bash
        run: echo "SMALT_SKIP_JOB=$(echo '${{ runner.os }}-${{ runner.arch }}-${{ inputs.simd }}-smoke' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: ./.github/actions/test-jvms
        with:
          forks: ${{ inputs.coverage == 'true' && '1' || inputs.forks }}

      - uses: ./.github/actions/oracles
        with:
          save: ${{ inputs.cache_save }}

      - uses: ./.github/actions/testdata
        with:
          save: ${{ inputs.cache_save }}

      - uses: ./.github/actions/oracle-data
        with:
          artifact: 'true'

      - name: Build the modules they depend on
        shell: bash
        run: mvn -B -ntp -q -T 1C -pl "${{ inputs.modules }}" -am install -DskipTests

      - name: Test
        id: test
        shell: bash
        run: >
          mvn -B -ntp -fae -pl "${{ inputs.modules }}" verify $SMALT_TEST_FORKS
          -Dsmalt.test.simd=${{ inputs.simd == 'vector' }} ${{ inputs.properties }}
          ${{ inputs.coverage == 'true' && '-Pcoverage -Dmaven.test.failure.ignore=true' || '' }}
          ${{ inputs.maven_args }}
          ${{ inputs.tests != '' && format('-Dtest={0} -Dsurefire.failIfNoSpecifiedTests=false', inputs.tests) || '' }}

      # The suites of these modules may skip no more than the full CI job of the same runner does.
      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            */target/kernel-guard/*/*/result.tsv
            */target/kernel-guard/*/*/vm.log
            it/target/kernel-guard-self/
            it/target/jit-stress/*/stdout.log
            **/hs_err_pid*.log
            */target/media-fixtures/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 7

      - name: Summarize the coverage
        if: always() && inputs.coverage == 'true'
        shell: bash
        run: |
          for report in it/target/site/jacoco-aggregate/jacoco.xml */target/site/jacoco/jacoco.xml; do
            if [ -f "$report" ]; then
              python tools/coverage/coverage.py "$report" --markdown coverage.md --tsv coverage.tsv
              cat coverage.md >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

      - name: Upload the coverage reports
        if: always() && inputs.coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: |
            **/target/site/jacoco*/jacoco.xml
            it/target/site/jacoco-aggregate/
            coverage.md
            coverage.tsv
          retention-days: 14
