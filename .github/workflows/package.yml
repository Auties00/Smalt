# Manual: builds the given modules with what they depend on, then runs only their own test suites on the chosen
# runners with the oracle tools, the smoke data tier and the clips, and checks their skips against the CI jobs' rows
# of the skip baseline. Development tooling dispatches it on snapshot branches to test one change without the
# whole matrix.
name: Package tests

on:
  workflow_dispatch:
    inputs:
      modules:
        description: Comma-separated modules whose suites run (for example core,image)
        required: true
      os:
        description: JSON list of runners
        default: '["ubuntu-latest"]'
      tests:
        description: Optional surefire -Dtest filter
        default: ''
      simd:
        description: vector or scalar
        default: vector
      coverage:
        description: true to run with the JaCoCo coverage profile and upload the reports
        default: 'false'
      maven_args:
        description: Extra Maven arguments for the test run, for example -Dsmalt.soak.minutes=5
        default: ''
      properties:
        description: Optional extra system properties for the test JVMs, for example -Dsmalt.threads=1
        default: ''

permissions:
  contents: read

env:
  JAVA_VERSION: '26'
  SMALT_CONFORMANCE_DOWNLOAD: 'false'

jobs:
  oracles:
    uses: ./.github/workflows/oracle-tools.yml
    with:
      os: ${{ inputs.os }}

  test:
    name: test (${{ matrix.os }})
    needs: oracles
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Name the job in the skip baseline
        shell: bash
        run: echo "SMALT_SKIP_JOB=$(echo '${{ runner.os }}-${{ runner.arch }}-${{ inputs.simd }}-smoke' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: ./.github/actions/oracles

      - uses: ./.github/actions/testdata

      - name: Build the modules they depend on
        shell: bash
        run: mvn -B -ntp -q -pl "${{ inputs.modules }}" -am install -DskipTests

      - name: Test
        id: test
        shell: bash
        run: >
          mvn -B -ntp -fae -pl "${{ inputs.modules }}" verify
          -Dsmalt.test.simd=${{ inputs.simd == 'vector' }} ${{ inputs.properties }}
          ${{ inputs.coverage == 'true' && '-Pcoverage -Dmaven.test.failure.ignore=true' || '' }}
          ${{ inputs.maven_args }}
          ${{ inputs.tests != '' && format('-Dtest={0} -Dsurefire.failIfNoSpecifiedTests=false', inputs.tests) || '' }}

      # The suites of these modules may skip no more than the full CI job of the same runner does.
      - name: Check the skips against the baseline
        if: always() && steps.test.outcome != 'skipped'
        shell: bash
        run: |
          python tools/testdata/skips.py report --job "$SMALT_SKIP_JOB" --out "target/skips-$SMALT_SKIP_JOB.tsv" || true
          python tools/testdata/skips.py check --job "$SMALT_SKIP_JOB"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            */target/kernel-guard/*/*/result.tsv
            */target/kernel-guard/*/*/vm.log
            it/target/kernel-guard-self/
            it/target/jit-stress/*/stdout.log
            */target/media-fixtures/
            target/skips-*.tsv
            oracle-versions.tsv
          retention-days: 7

      - name: Summarize the coverage
        if: always() && inputs.coverage == 'true'
        shell: bash
        run: |
          for report in it/target/site/jacoco-aggregate/jacoco.xml */target/site/jacoco/jacoco.xml; do
            if [ -f "$report" ]; then
              python tools/coverage/coverage.py "$report" --markdown coverage.md --tsv coverage.tsv
              cat coverage.md >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

      - name: Upload the coverage reports
        if: always() && inputs.coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: |
            **/target/site/jacoco*/jacoco.xml
            it/target/site/jacoco-aggregate/
            coverage.md
            coverage.tsv
          retention-days: 14
